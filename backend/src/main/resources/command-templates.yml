# 预置命令模板配置
# 可通过修改此文件来增删改预置命令，无需修改数据库
# 数据库切换时只需修改 application.yml 中的 database.type

# JVM 原生命令
jvm:
  - name: JVM堆内存
    commandType: jmap
    template: jmap -heap {pid}
    description: 查看JVM堆内存信息
  - name: JVM线程堆栈
    commandType: jstack
    template: jstack -l {pid}
    description: 查看JVM线程堆栈（含锁信息）
  - name: JVM堆内存转储
    commandType: jmap
    template: jmap -dump:format=b,file=heap.hprof {pid}
    description: 导出堆内存转储文件
  - name: JVM垃圾回收
    commandType: jmap
    template: jmap -gcutil {pid}
    description: 查看垃圾回收统计信息

# Arthas 基础命令
arthas-basic:
  - name: Arthas仪表盘
    commandType: arthas
    template: dashboard
    description: 实时数据面板（CPU、内存、线程）
  - name: JVM信息
    commandType: arthas
    template: jvm
    description: 查看JVM详细信息
  - name: 内存信息
    commandType: arthas
    template: memory
    description: 查看JVM内存详情
  - name: 线程总览
    commandType: arthas
    template: thread
    description: 查看所有线程状态
  - name: 线程详情
    commandType: arthas
    template: thread {pid}
    description: 查看指定线程详情

# Arthas 诊断命令
arthas-diagnose:
  - name: 反编译类
    commandType: arthas
    template: jad {className}
    description: 反编译指定类
  - name: 查看方法签名
    commandType: arthas
    template: sm -d {className} {methodName}
    description: 查看方法签名详情
  - name: 查看类信息
    commandType: arthas
    template: sc -d {className}
    description: 查看类的详细信息
  - name: 类加载器
    commandType: arthas
    template: classloader
    description: 查看类加载器信息

# Arthas 观测命令
arthas-watch:
  - name: 观察方法调用
    commandType: arthas
    template: watch {className} {methodName} "{params,returnObj}"
    description: 观察方法入参和返回值
  - name: 方法调用追踪
    commandType: arthas
    template: trace {className} {methodName}
    description: 追踪方法调用路径和耗时
  - name: 方法堆栈追踪
    commandType: arthas
    template: stack {className} {methodName}
    description: 查看方法调用堆栈
  - name: 监听事件
    commandType: arthas
    template: watch {className} {methodName} "@org.springframework.web.bind.annotation.RequestMapping" -x 3
    description: 监听Spring MVC请求

# Arthas 火焰图
arthas-profiler:
  - name: 火焰图CPU
    commandType: arthas
    template: profiler start --event cpu
    description: 启动CPU采样
  - name: 火焰图内存
    commandType: arthas
    template: profiler start --event allocations
    description: 启动内存分配采样
  - name: 火焰图停止
    commandType: arthas
    template: profiler stop
    description: 停止采样并生成火焰图

# Arthas 热更新命令
arthas-hot:
  - name: 热更新类
    commandType: arthas
    template: redefine /path/to/class/{className}.class
    description: 热更新类定义（谨慎使用）
