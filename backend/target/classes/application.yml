server:
  port: 8080

spring:
  application:
    name: ops-platform
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:data/ops-platform.db
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  # 使用 Log4j2 日志框架
  logging:
    config: classpath:log4j2.xml

# 日志配置（Log4j2 通过 log4j2.xml 配置）
logging:
  level:
    root: INFO
    com.ops: DEBUG
  file:
    name: logs/ops-platform.log

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:ops-platform-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  upload:
    path: data/uploads
    max-size: 52428800
